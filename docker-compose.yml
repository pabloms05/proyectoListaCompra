services:
  # Aplicación Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: listacompra_app
    restart: "no"
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - listacompra_network
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite

  # Nginx - Servidor web
  nginx:
    image: nginx:alpine
    container_name: listacompra_nginx
    restart: "no"
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - listacompra_network
      - proxy_network
    depends_on:
      - app

networks:
  listacompra_network:
    driver: bridge
  proxy_network:
    external: true
    name: proxy_network
